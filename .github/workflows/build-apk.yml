name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web App Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Install Stable Capacitor 6
        run: |
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 --legacy-peer-deps

      - name: Prepare Clean Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Enable Android WebView Multi-Touch Pinch Zoom Support
        run: |
          mkdir -p android/app/src/main/java/com/greatstar/enginespec
          cat << 'EOF' > android/app/src/main/java/com/greatstar/enginespec/MainActivity.java
          package com.greatstar.enginespec;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebSettings webSettings = this.bridge.getWebView().getSettings();
                          webSettings.setSupportZoom(true);
                          webSettings.setBuiltInZoomControls(true);
                          webSettings.setDisplayZoomControls(false);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Configure Android App Label Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">GreatStar Engine Guide<\/string>/g' android/app/src/main/res/values/strings.xml || true
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">GreatStar Engine Guide<\/string>/g' android/app/src/main/res/values/strings.xml || true

      - name: Install GreatStar Custom App Icons
        run: |
          if [ -f "public/greatstar_logo.jpg" ]; then
            # Remove anydpi-v26 xml to prevent duplicate resource error with raster icon files
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp public/greatstar_logo.jpg "$dir/ic_launcher.png"
                cp public/greatstar_logo.jpg "$dir/ic_launcher_round.png"
              fi
            done
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GreatStar Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatStar-Engine-Guide-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
